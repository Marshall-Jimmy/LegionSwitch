name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Unit tests
        env:
          LEGIONSWITCH_PREVIEW: "1"
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LegionSwitch-windows-x64
          path: target/release/LegionSwitch.exe
          if-no-files-found: error
