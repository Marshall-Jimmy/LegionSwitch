[package]
name = "legion-switch"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["jimmma"]
description = "Lightweight native Lenovo Legion performance-mode switcher with a LegionZone-inspired UI"
license = "MIT"
repository = "https://github.com/Marshall-Jimmy/LegionSwitch"
homepage = "https://github.com/Marshall-Jimmy/LegionSwitch"
readme = "README.md"
publish = false

[[bin]]
name = "LegionSwitch"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }
wmi = { version = "0.18.4", default-features = false }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
